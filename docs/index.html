<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paris by Bus</title>
<meta name="description" content="Every bus of Paris and Île-de-France over one weekday, animated from the Île-de-France Mobilités timetable.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23111'/%3E%3Ctext x='16' y='20.5' font-family='Arial' font-weight='700' font-size='11' fill='%23fff' text-anchor='middle'%3EBUS%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fleet/fleet.bin.gz" as="fetch" crossorigin>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<header class="panel brand">
  <span class="picto" aria-hidden="true">BUS</span>
  <div>
    <h1>Paris by Bus</h1>
    <p id="subtitle">Every bus of Île-de-France Mobilités over one weekday</p>
  </div>
</header>

<section class="panel filter" id="filter">
  <button class="filter-toggle" id="filter-toggle" aria-haspopup="listbox" aria-expanded="false">
    <span class="filter-label">Lines</span>
    <span class="filter-value" id="filter-value">All lines</span>
    <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="dropdown" id="dropdown" hidden>
    <div class="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Search a line or a network" autocomplete="off" spellcheck="false">
    </div>
    <div class="dropdown-actions">
      <button id="select-all" class="link">All lines</button>
      <span id="selection-count"></span>
    </div>
    <div class="options" id="options" role="listbox" aria-multiselectable="true"></div>
  </div>
</section>

<footer class="panel player">
  <button class="play" id="play" aria-label="Play">
    <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
    <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>
  </button>
  <div class="readout">
    <div class="clock" id="clock">--:--</div>
    <div class="count"><span id="count">0</span> buses running</div>
  </div>
  <div class="timeline" id="timeline">
    <canvas id="activity" aria-hidden="true"></canvas>
    <input id="time" type="range" min="0" max="1" step="1" value="0" aria-label="Time of day">
    <div class="ticks" id="ticks" aria-hidden="true"></div>
  </div>
</footer>

<div class="loading" id="loading">
  <span class="picto">BUS</span>
  <div class="bar"><div id="progress"></div></div>
  <p id="loading-text">Loading timetable</p>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/deck.gl.min.js"></script>
<script src="app.js"></script>
</body>
</html>
